name: Contribution Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg
            assets/contribution-snake-dark.svg?palette=github-dark

      - name: Commit and push changes
        run: |
          git config user.name "accxiong"
          git config user.email "786507017@qq.com"
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          git diff --cached --quiet || git commit -m "chore: generate contribution snake"
          git push origin HEAD:main
